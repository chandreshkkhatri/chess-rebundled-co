# Bootstrap a NEW hostname before running Certbot --nginx.
# Certbot adds HTTPS and the HTTP redirect; do not reapply over that TLS vhost.
# Chess Rebundled backend API. Frontend remains hosted separately.
server {
    listen 80;
    server_name api.chess.rebundled.co;

    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
