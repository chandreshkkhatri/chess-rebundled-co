name: Validate and deploy production backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.nvmrc'
      - '.dockerignore'
      - 'compose.yaml'
      - 'scripts/deploy-backend.sh'
      - 'scripts/tests/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: validate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Build both packages
        run: pnpm build
      - name: Check deployment script
        run: |
          bash -n scripts/deploy-backend.sh scripts/setup-oracle-vm.sh
          bash scripts/tests/deploy-backend.test.sh
      - name: Validate Compose and build backend image
        run: |
          cp backend/.env.example backend/.env
          docker compose config --quiet
          docker compose build backend

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    concurrency:
      group: production-backend
      cancel-in-progress: false
    steps:
      - name: Deploy the validated commit via SSH
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USERNAME }}
          DEPLOY_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Set the HOST secret}"
          : "${DEPLOY_USER:?Set the USERNAME secret}"
          : "${DEPLOY_KEY:?Set the SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the SSH_KNOWN_HOSTS secret}"
          key_file="$RUNNER_TEMP/chess-deploy-key"
          hosts_file="$RUNNER_TEMP/chess-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -l "$DEPLOY_USER" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts_file" \
            -- "$DEPLOY_HOST" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
          set -Eeuo pipefail
          deploy_sha="$1"
          [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          cd "$HOME/deployments/prod/chess-rebundled-co"
          exec 9> "$(git rev-parse --git-path compose-deploy.lock)"
          flock -w 1800 9
          git fetch --prune origin main
          git merge-base --is-ancestor "$deploy_sha" origin/main
          git reset --hard "$deploy_sha"
          CHESS_DEPLOY_LOCKED=1 bash scripts/deploy-backend.sh
          REMOTE
