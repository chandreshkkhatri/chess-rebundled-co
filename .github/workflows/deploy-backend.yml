name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Navigate to the project directory
            # Note: Path based on your previous terminal output
            cd ~/deployments/prod/chess-rebundled-co

            # Pull latest changes
            git pull origin main

            # Backend Build & Restart
            cd backend
            npm install
            npm run build

            # Restart Application
            pm2 restart chess-backend
